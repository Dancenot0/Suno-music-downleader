<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171d"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>

    <radialGradient id="sun" cx="0.36" cy="0.30" r="0.78">
      <stop offset="0"    stop-color="#FFDCAC"/>
      <stop offset="0.42" stop-color="#F2A94E"/>
      <stop offset="1"    stop-color="#E8705B"/>
    </radialGradient>

    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0"   stop-color="#F2A94E" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#E8705B" stop-opacity="0.10"/>
      <stop offset="1"   stop-color="#E8705B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- baldosa -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="0.75" y="0.75" width="510.5" height="510.5" rx="115.25"
        fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- halo -->
  <circle cx="256" cy="252" r="210" fill="url(#glow)"/>

  <!-- sol -->
  <circle cx="256" cy="252" r="134" fill="url(#sun)"/>
  <circle cx="256" cy="252" r="134" fill="none"
          stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- centro -->
  <circle cx="256" cy="252" r="53" fill="#0a0a0c"/>

  <!-- brillo superior -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#sheen)"/>
</svg>
